<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">From two decoding schedules to one channel by block cache</title><desc id="flow-desc">Growing next-scale token grids and fixed-size next-frame token grids both enter a cache with feature channels horizontally and decoding blocks vertically. VAR-Q assigns a scale factor to each channel within each block, then packs low-bit values into INT32 storage.</desc><defs><pattern id="token-grid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M 9 0 L 0 0 0 9" fill="none" stroke="#fff" stroke-width="1"/></pattern><marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#87818d"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#292631}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#67616e}.tiny{font-size:10px;fill:#67616e}.mono{font-family:monospace}</style><text x="22" y="28" class="tiny mono">01 / GENERATION LOOP</text><text x="440" y="28" class="tiny mono">02 / SHARED KV STRUCTURE</text><text x="875" y="28" class="tiny mono">03 / STORED CACHE</text><text x="22" y="66" class="label">Next-scale</text><text x="22" y="88" class="small">Coarse → fine</text><rect x="22" y="136" width="22" height="22" rx="2" fill="#c1b1e5"/><rect x="22" y="136" width="22" height="22" fill="url(#token-grid)"/><rect x="81" y="119" width="39" height="39" rx="2" fill="#c1b1e5"/><rect x="81" y="119" width="39" height="39" fill="url(#token-grid)"/><rect x="158" y="96" width="62" height="62" rx="2" fill="#c1b1e5"/><rect x="158" y="96" width="62" height="62" fill="url(#token-grid)"/><path d="M52 147H70 M129 138H147" stroke="#87818d" marker-end="url(#arrowhead)"/><text x="22" y="207" class="label">Next-frame</text><text x="22" y="229" class="small">Past → future</text><rect x="22" y="250" width="49" height="37" rx="2" fill="#95c5b8"/><rect x="22" y="250" width="49" height="37" fill="url(#token-grid)"/><rect x="102" y="250" width="49" height="37" rx="2" fill="#95c5b8"/><rect x="102" y="250" width="49" height="37" fill="url(#token-grid)"/><rect x="182" y="250" width="49" height="37" rx="2" fill="#95c5b8"/><rect x="182" y="250" width="49" height="37" fill="url(#token-grid)"/><path d="M78 270H94 M158 270H174" stroke="#87818d" marker-end="url(#arrowhead)"/><path d="M248 130H310V191H379 M248 270H310V191" stroke="#87818d" fill="none" stroke-width="1.3"/><path d="M370 191H420" stroke="#87818d" marker-end="url(#arrowhead)"/><text x="309" y="176" text-anchor="middle" class="tiny">block b</text><text x="494" y="74" class="small">Feature channels →</text><text transform="translate(426,225) rotate(-90)" class="small">Decoding blocks →</text><rect x="448" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="473" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="498" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="523" y="96" width="23" height="55" rx="1" fill="#83709e"/><rect x="548" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="573" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="598" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="623" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="648" y="96" width="23" height="55" rx="1" fill="#83709e"/><rect x="673" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="698" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="723" y="96" width="23" height="55" rx="1" fill="#f0edf6"/><rect x="448" y="154" width="23" height="55" rx="1" fill="#e1dbea"/><rect x="473" y="154" width="23" height="55" rx="1" fill="#e1dbea"/><rect x="498" y="154" width="23" height="55" rx="1" fill="#e1dbea"/><rect x="523" y="154" width="23" height="55" rx="1" fill="#493966"/><rect x="548" y="154" width="23" height="55" rx="1" fill="#e1dbea"/><rect x="573" y="154" width="23" height="55" rx="1" fill="#e1dbea"/><rect x="